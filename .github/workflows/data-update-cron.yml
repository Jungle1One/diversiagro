name: Actualización Automática de Datos (MLOps)

on:
  schedule:
    # Se ejecuta el día 1 de cada mes a las 00:00 UTC
    - cron: '0 0 1 * *'
  
  # Permite ejecutar el flujo manualmente desde la interfaz de GitHub
  workflow_dispatch:

jobs:
  data-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Instalar dependencias del sistema operativo (GDAL)
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev build-essential
        export CPLUS_INCLUDE_PATH=/usr/include/gdal
        export C_INCLUDE_PATH=/usr/include/gdal

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Extracción (Pipeline UPRA/IDEAM)
      run: |
        # Esto demostrará que el pipeline de datos está vivo y descarga la info
        # más reciente de la API de Socrata (datos.gov.co)
        python src/data_pipeline/run_all_zonificaciones.py

    - name: Notificar Finalización
      run: |
        echo "Los datos geográficos y climáticos han sido actualizados exitosamente con la información más reciente de datos.gov.co"
