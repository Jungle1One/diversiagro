name: CI / Continuous Integration

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip' # Acelera las instalaciones usando caché

    - name: Instalar dependencias del sistema operativo (GDAL/Geos)
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev build-essential
        export CPLUS_INCLUDE_PATH=/usr/include/gdal
        export C_INCLUDE_PATH=/usr/include/gdal

    - name: Instalar librerías de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Ejecutar Suite de Pruebas (pytest)
      env:
        # Variables de entorno simuladas para los tests
        GEMINI_API_KEY: "dummy-key-for-testing"
      run: |
        pytest tests/ -v
