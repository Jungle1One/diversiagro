version: '3.8'

services:
  backend:
    build:
      context: ../
      dockerfile: deployments/Dockerfile.backend
    container_name: diversiagro-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ../models:/app/models
      - ../data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: deployments/Dockerfile.frontend
    container_name: diversiagro-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped
